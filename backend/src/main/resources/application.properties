# WorkFlowOS Server Configuration
server.port=${PORT:8080}

# Database DataSource Configuration (H2 embedded file database by default; or Cloud MySQL when SPRING_DATASOURCE_URL is provided)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./workflowos_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# WorkFlowOS JWT Security Configuration
workflowos.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
workflowos.jwt.expiration-ms=86400000

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

